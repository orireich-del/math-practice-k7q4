const K = 'app-key-v1';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key) {

  document.open(); document.write(html); document.close();
}
async function tryStored() {

    const key = await crypto.subtle.importKey('raw', bytes(raw), 'AES-GCM', false, ['decrypt']);

  } catch (e) { try { localStorage.removeItem(K); } catch (_) {} }
}
document.getElementById('f').addEventListener('submit', async e => {

    try { localStorage.removeItem(K); } catch (_) {}

});
